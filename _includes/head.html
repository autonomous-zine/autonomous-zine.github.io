<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script data-goatcounter="https://autonomous-zine.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <link rel="me" href="https://mastodon.social/@nightshiftzine">
  <!-- Fediverse author attribution: when anyone shares one of these pages on
       Mastodon, the link preview card credits the publication and offers a
       "More from" path back to the account. Turns a third-party share into a
       discovery route, which matters here because shares are currently the
       only organic reach this publication has. Paired setting: the domain must
       also be listed under the account's allowed-attribution websites. -->
  <meta name="fediverse:creator" content="@nightshiftzine@mastodon.social">
</head>
